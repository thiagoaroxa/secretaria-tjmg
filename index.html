<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secretaria — Planejamento Organizacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--ink:#1a1f3a;--paper:#faf8f3;--parchment:#f4efe3;--accent:#7d2c20;--moss:#4f6049;--amber:#a87c2a;--muted:#6b6660;--line:#d8d2c2;--subtle:#efeae0;--card:#fff;--green:#4f6049;--yellow:#a87c2a;--red:#7d2c20;--display:'EB Garamond',Georgia,serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink)}
header.app-header{border-bottom:1px solid var(--line);background:var(--parchment)}
.header-inner{max-width:1180px;margin:0 auto;padding:28px 32px 24px}
.header-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;margin-bottom:6px}
h1.title{font-family:'Anton','Bebas Neue',Impact,sans-serif;font-size:64px;font-weight:400;margin:0;line-height:.92;letter-spacing:.005em;text-transform:uppercase;color:var(--ink)}
.subtitle{font-family:var(--display);font-size:18px;font-style:italic;color:var(--muted);margin-top:4px}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.saved-note{font-family:var(--mono);font-size:11px;color:var(--moss);letter-spacing:.1em;display:none;align-items:center;gap:6px;padding:6px 8px}
.saved-note.show{display:inline-flex}
.header-btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);background:transparent;border:1px solid var(--line);padding:6px 12px;cursor:pointer;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px}
.header-btn:hover{color:var(--ink);border-color:var(--ink)}
.header-btn.danger:hover{color:var(--accent);border-color:var(--accent)}
nav.tabs{max-width:1180px;margin:0 auto;padding:0 32px;display:flex;gap:0;overflow-x:auto}
.tab-btn{display:flex;align-items:center;gap:8px;padding:14px 18px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:14px;cursor:pointer;letter-spacing:.01em;margin-bottom:-1px;white-space:nowrap}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:32px}
.section-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.section-header-text{flex:1;min-width:280px}
h2.section-title{font-family:var(--display);font-size:28px;font-weight:600;margin:0;letter-spacing:-.01em}
.section-subtitle{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5;max-width:720px}
h3.group-title{font-family:var(--display);font-size:20px;font-weight:600;margin:0}
h3.cat-title{font-family:var(--display);font-size:17px;font-weight:600;margin:0}
h4.subgroup-title{font-family:var(--display);font-size:14px;font-weight:600;margin:14px 0 6px;color:var(--muted)}
.group-header{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.group-count{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em}
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:var(--ink);color:var(--paper);border:none;font-size:13px;font-weight:500;cursor:pointer}
.btn-primary:hover{background:#2a3050}
.btn-secondary{padding:8px 18px;background:transparent;border:1px solid var(--line);color:var(--ink);font-size:13px;cursor:pointer}
.btn-secondary:hover{border-color:var(--ink)}
.btn-confirm{padding:8px 20px;background:var(--ink);border:none;color:#fff;font-size:13px;font-weight:500;cursor:pointer}
.btn-confirm:hover{background:#2a3050}
.btn-confirm.danger{background:var(--accent)}
.btn-confirm.danger:hover{background:#92382c}
.btn-confirm:disabled{background:var(--line);color:#999;cursor:not-allowed}
.icon-btn{background:transparent;border:1px solid var(--line);padding:5px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;line-height:0}
.icon-btn:hover{color:var(--ink);border-color:var(--ink)}
.icon-btn.danger:hover{color:var(--accent);border-color:var(--accent)}
.input,.select,.textarea{width:100%;padding:8px 12px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--ink);outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ink)}
.textarea{resize:vertical;font-family:var(--body)}
.select{cursor:pointer}
.select:disabled{background:var(--subtle);color:var(--muted);cursor:not-allowed}
.filter-row{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.search-wrapper{position:relative;flex:1 1 240px;min-width:200px}
.search-wrapper svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-wrapper input{width:100%;padding:8px 12px 8px 32px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--ink);outline:none}
.search-wrapper input:focus{border-color:var(--ink)}
.checkbox-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.checkbox-label input{accent-color:var(--accent)}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.team-section{margin-bottom:36px}
.member-card{background:var(--card);border:1px solid var(--line);padding:16px 16px 14px}
.member-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.member-name{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.2;margin-bottom:4px}
.member-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.member-actions{display:flex;gap:4px}
.member-tags{margin-top:10px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--ink);background:var(--subtle);padding:2px 8px;border:1px solid var(--line)}
.member-notes{margin-top:10px;font-size:12px;color:var(--muted);font-style:italic;border-left:2px solid var(--line);padding-left:8px}
.role-badge{font-family:var(--mono);font-size:10px;padding:2px 7px;letter-spacing:.08em;color:#faf8f3}
.role-badge.servidor{background:#1a1f3a}
.role-badge.comissionado{background:#3b4670}
.role-badge.terceirizado{background:#4f6049}
.role-badge.estagiario{background:#a87c2a}
.role-badge.chefe{background:#7d2c20}
.role-badge-sm{font-family:var(--mono);font-size:9px;padding:1px 6px;letter-spacing:.05em;color:#faf8f3}
.role-badge-sm.servidor{background:#1a1f3a}
.role-badge-sm.comissionado{background:#3b4670}
.role-badge-sm.terceirizado{background:#4f6049}
.role-badge-sm.estagiario{background:#a87c2a}
.role-badge-sm.chefe{background:#7d2c20}
.meta-text{font-family:var(--mono);font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.task-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-top:none;margin-bottom:-1px}
.task-row:first-of-type{border-top:1px solid var(--line)}
.task-name{font-size:14px;font-weight:500;color:var(--ink);line-height:1.3}
.task-meta{display:flex;gap:10px;margin-top:4px;align-items:center;flex-wrap:wrap}
.task-meta-text{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.05em}
.task-anchor{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.03em}
.role-pills{display:flex;gap:4px}
.task-load-info{font-family:var(--mono);font-size:10px;color:var(--ink);padding:2px 6px;background:var(--subtle);border:1px solid var(--line)}
.task-load-info.empty{color:var(--muted);background:transparent;border-style:dashed}
.task-load-info.real{color:var(--moss)}
.task-load-info.high-fte{background:#f4ebd5;color:var(--amber);border-color:var(--amber)}
.task-load-info.very-high-fte{background:#f4dcd6;color:var(--red);border-color:var(--red)}
.fte-summary{padding:10px 14px;background:var(--parchment);border:1px solid var(--line);font-size:13px;margin-top:-4px;margin-bottom:14px}
.fte-summary.warn{background:#f4ebd5;border-color:var(--amber)}
.fte-summary.alert{background:#f4dcd6;border-color:var(--red)}
.fte-summary strong{font-family:var(--mono);font-size:14px}
.assign-grid-header{display:grid;grid-template-columns:1fr 240px 240px;gap:12px;padding:8px 14px;border-bottom:2px solid var(--ink);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.assign-row{display:grid;grid-template-columns:1fr 240px 240px;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);align-items:center}
.assign-row.no-titular{background:#fdf6f3}
.assign-task-meta{display:flex;gap:6px;margin-top:3px;align-items:center;flex-wrap:wrap}
.badge-warning{font-size:10px;color:var(--accent);font-family:var(--mono);letter-spacing:.05em;display:inline-flex;align-items:center;gap:3px}
.badge-warning.amber{color:var(--amber)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:28px}
.metric{background:var(--card);border:1px solid var(--line);padding:14px 16px}
.metric-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.metric-value{font-family:var(--display);font-size:32px;font-weight:600;color:var(--ink);line-height:1}
.metric-value.positive{color:var(--moss)}
.metric-value.negative{color:var(--accent)}
.metric-value.warning{color:var(--amber)}
.metric-value-of{font-size:16px;color:var(--muted);font-weight:400}
.diag-section{margin-bottom:32px}
.diag-section-header{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.diag-section-title{font-family:var(--display);font-size:18px;font-weight:600;margin:0}
.diag-section-help{font-size:12px;color:var(--muted);margin-bottom:14px}
.capacity-row{display:grid;grid-template-columns:220px 1fr 160px;gap:14px;align-items:center;margin-bottom:14px}
.capacity-bar-track{position:relative;height:28px;background:var(--subtle);border:1px solid var(--line)}
.capacity-bar-fill{position:absolute;left:0;top:0;bottom:0;transition:width .2s}
.capacity-bar-fill.green{background:var(--green)}
.capacity-bar-fill.yellow{background:var(--yellow)}
.capacity-bar-fill.red{background:var(--red)}
.capacity-bar-mark{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink)}
.capacity-bar-mark::after{content:'100%';position:absolute;top:-14px;left:-16px;font-family:var(--mono);font-size:9px;color:var(--ink);letter-spacing:.05em}
.capacity-numbers{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink)}
.capacity-numbers .pct{font-size:14px;font-weight:600}
.capacity-numbers .pct.green{color:var(--green)}
.capacity-numbers .pct.yellow{color:var(--yellow)}
.capacity-numbers .pct.red{color:var(--red)}
.capacity-status{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.capacity-status.green{color:var(--green)}
.capacity-status.yellow{color:var(--yellow)}
.capacity-status.red{color:var(--red)}
.capacity-breakdown{font-size:11px;color:var(--muted);margin-top:2px}
.diag-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.diag-list-card{background:var(--card);border:1px solid var(--line);padding:16px}
.diag-list-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.diag-list-title{font-family:var(--display);font-size:16px;font-weight:600;margin:0}
.diag-list-count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.diag-list ul{margin:0;padding:0;list-style:none}
.diag-list li{font-size:13px;padding:5px 0;border-bottom:1px dotted var(--line);line-height:1.4}
.diag-list li:last-child{border-bottom:none}
.diag-list .item-sub{color:var(--muted);font-size:11px}
.diag-list .empty{font-size:13px;color:var(--muted);font-style:italic;display:flex;align-items:center;gap:6px}
.diag-list .empty svg{color:var(--moss)}
.dropzone{border:2px dashed var(--line);padding:40px;text-align:center;background:var(--card);cursor:pointer;transition:.15s}
.dropzone:hover{border-color:var(--ink);background:var(--subtle)}
.dropzone-title{font-family:var(--display);font-size:18px;font-weight:600;margin-bottom:4px;margin-top:12px}
.dropzone-message{font-size:13px;color:var(--muted)}
.import-card{background:var(--card);border:1px solid var(--line);padding:14px 16px;margin-bottom:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.import-card-info{flex:1;min-width:0}
.import-card-title{font-family:var(--display);font-size:17px;font-weight:600;margin-bottom:3px}
.import-months{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.month-pill{font-family:var(--mono);font-size:11px;padding:2px 8px;background:var(--subtle);border:1px solid var(--line);color:var(--ink)}
.map-summary{display:flex;gap:20px;margin-bottom:16px;padding:12px 16px;background:var(--parchment);border:1px solid var(--line);flex-wrap:wrap}
.map-summary-item{font-size:13px}
.map-summary-item strong{font-family:var(--mono);font-size:16px;font-weight:600}
.map-row{display:grid;grid-template-columns:1fr 80px 280px;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card);align-items:center}
.map-row.pending{background:#fdf9f0}
.map-row-desc{font-size:13px;color:var(--ink);line-height:1.3}
.map-row-count{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.map-grid-header{display:grid;grid-template-columns:1fr 80px 280px;gap:12px;padding:8px 14px;border-bottom:2px solid var(--ink);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.empty-state{background:var(--card);border:1px dashed var(--line);padding:40px 28px;text-align:center}
.empty-state svg{color:var(--muted);margin-bottom:12px}
.empty-state-title{font-family:var(--display);font-size:18px;font-weight:600;margin-bottom:4px;color:var(--ink)}
.empty-state-message{font-size:13px;color:var(--muted);line-height:1.5;max-width:460px;margin:0 auto}
.modal-backdrop{position:fixed;inset:0;background:rgba(26,31,58,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--paper);border:1px solid var(--line);max-width:540px;width:100%;max-height:90vh;overflow-y:auto}
.modal.narrow{max-width:440px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
.modal-title{font-family:var(--display);font-size:22px;font-weight:600;margin:0}
.modal-close{background:transparent;border:none;cursor:pointer;color:var(--muted);padding:4px;line-height:0}
.modal-close:hover{color:var(--ink)}
.modal-body{padding:20px 24px 24px}
.modal-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.form-field{margin-bottom:14px}
.form-label{display:block;font-family:var(--mono);font-size:10px;color:var(--ink);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:6px}
.form-hint{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}
.input-with-suffix{display:flex;align-items:center;gap:8px}
.input-suffix{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.role-toggle-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.role-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 10px;background:transparent;border:1px solid transparent}
.role-toggle:has(input:checked){background:var(--subtle);border-color:var(--line)}
.role-toggle input{accent-color:var(--accent)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--ink);color:var(--paper);padding:10px 18px;font-size:13px;transition:transform .3s;z-index:100;box-shadow:0 4px 20px rgba(26,31,58,.2);max-width:540px}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--accent)}
.toast.warning{background:var(--amber)}
.info-callout{background:var(--parchment);border-left:3px solid var(--accent);padding:10px 14px;font-size:12px;color:var(--ink);margin-bottom:16px;line-height:1.5}
.compare-table{width:100%;border-collapse:collapse;margin-bottom:14px;background:var(--card)}
.compare-table th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--ink);text-align:left;white-space:nowrap}
.compare-table th.num{text-align:right}
.compare-table td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.compare-table td.num{font-family:var(--mono);text-align:right}
.compare-table tr:hover td{background:var(--subtle)}
.compare-table .servidor-cell{font-weight:500;display:flex;align-items:center;gap:8px;white-space:nowrap}
.bar-cell{position:relative}
.bar-cell::before{content:'';position:absolute;left:0;top:2px;bottom:2px;background:var(--moss);opacity:.18;width:var(--bar-w,0%);transition:width .3s}
.bar-cell>span{position:relative;z-index:1}
.stack-bar{display:flex;height:14px;width:140px;border:1px solid var(--line);background:var(--subtle)}
.stack-bar>div{height:100%}
.stack-bar .seg-active{background:var(--moss)}
.stack-bar .seg-ignored{background:var(--muted);opacity:.5}
.stack-bar .seg-pending{background:var(--accent);opacity:.6}
.stack-legend{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.startup-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;background:var(--paper)}
.startup-brand{text-align:center;margin-bottom:36px}
.startup-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.startup-title{font-family:'Anton','Bebas Neue',Impact,sans-serif;font-size:96px;font-weight:400;margin:0;line-height:.92;letter-spacing:.005em;text-transform:uppercase;color:var(--ink)}
.startup-subtitle{font-family:var(--display);font-size:18px;font-style:italic;color:var(--muted);margin-top:6px}
.startup-card{background:var(--card);border:1px solid var(--line);padding:28px 32px;max-width:460px;width:100%}
.startup-card-title{font-family:var(--display);font-size:22px;font-weight:600;margin:0 0 6px}
.startup-card-help{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5}
.comarca-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.comarca-item{background:var(--card);border:1px solid var(--line);padding:14px 16px;cursor:pointer;text-align:left;width:100%;transition:.15s;display:block}
.comarca-item:hover{border-color:var(--ink);background:var(--subtle)}
.comarca-item-name{font-family:var(--display);font-size:18px;font-weight:600;color:var(--ink);margin-bottom:3px}
.comarca-item-meta{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.03em}
.comarca-item-actions{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:none}
.comarca-item:hover .comarca-item-actions{display:flex;gap:4px}
.folder-info{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--subtle);padding:8px 12px;border:1px solid var(--line);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;word-break:break-all}
.folder-info-path{font-weight:500;color:var(--ink)}
.save-status{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent}
.save-status.saved{color:var(--moss)}
.save-status.saving{color:var(--amber)}
.save-status.error{color:var(--accent);border-color:var(--accent)}
.save-status.fallback{color:var(--amber);border-color:var(--amber)}
.save-status-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.save-status.saving .save-status-dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.mode-banner{background:var(--parchment);border-bottom:1px solid var(--line);padding:6px 16px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.mode-banner.warning{background:#f4ebd5;color:var(--amber);border-bottom-color:var(--amber)}
@media (max-width:720px){.header-inner,nav.tabs,main{padding-left:20px;padding-right:20px}h1.title{font-size:30px}.assign-grid-header,.assign-row{grid-template-columns:1fr;gap:6px}.modal-grid-2{grid-template-columns:1fr}.capacity-row{grid-template-columns:1fr;gap:6px}.map-row,.map-grid-header{grid-template-columns:1fr;gap:6px}}

  closeCurrentComarca(){this.currentFileHandle=null;this.currentFileName=null;},

function renderAssignmentRow(t){const el=state.team.filter(m=>t.allowedRoles?.includes(m.role)&&(t.area==='ambas'||m.area==='ambas'||m.area===t.area));const a=state.assignments[t.id]||{};const tit=state.team.find(m=>m.id===a.titularId);const res=state.team.find(m=>m.id===a.reservaId);const noT=!tit,noR=tit&&!res;const hr=taskHoursPerMonth(t);let hl,fteWarn='';if(hr!=null){const fte=hr/168;hl=`${fmt1(hr)}h/mês · ≈ ${fmt1(fte)} serv.`;if(fte>2)fteWarn=`<span class="badge-warning">${ICONS.alert} EXIGE >2 SERVIDORES</span>`;else if(fte>1)fteWarn=`<span class="badge-warning amber">${ICONS.shield} EXIGE >1 SERVIDOR</span>`;}else{hl='sem dados';}return `<div class="assign-row ${noT?'no-titular':''}"><div style="min-width:0;"><div class="task-name" style="font-size:13.5px;">${esc(t.name)}</div><div class="assign-task-meta">${t.legalAnchor?`<span class="task-anchor" style="font-size:9px;">${esc(t.legalAnchor)}</span>`:''}<span class="task-meta-text">${hl}</span>${fteWarn}${noT?`<span class="badge-warning">${ICONS.alert} SEM TITULAR</span>`:''}${noR?`<span class="badge-warning amber">${ICONS.shield} SEM RESERVA</span>`:''}</div></div><select class="select" onchange="setAssignment('${t.id}','titularId',this.value)"><option value="">— escolher titular —</option>${el.map(m=>`<option value="${m.id}" ${a.titularId===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><select class="select" onchange="setAssignment('${t.id}','reservaId',this.value)" ${!a.titularId?'disabled':''}><option value="">— escolher reserva —</option>${el.filter(m=>m.id!==a.titularId).map(m=>`<option value="${m.id}" ${a.reservaId===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>`;}
function setAssignment(taskId,slot,memberId){if(!state.assignments[taskId])state.assignments[taskId]={};state.assignments[taskId][slot]=memberId||null;if(slot==='titularId'&&!memberId)state.assignments[taskId].reservaId=null;save();render();}
function renderDiagnostico(){let h=`<section><div class="section-header"><div class="section-header-text"><h2 class="section-title">Diagnóstico</h2><div class="section-subtitle">Capacidade de atender a demanda. As barras mostram a carga em horas/mês de cada integrante (titular + ${(RESERVE_WEIGHT*100).toFixed(0)}% como reserva) contra a capacidade dele/dela. Verde até 85%, amarelo entre 85% e 100%, vermelho acima de 100%.</div></div></div>`;if(state.team.length===0){h+=`<div class="empty-state"><div class="empty-state-title">Sem dados ainda</div><div class="empty-state-message">Cadastre a equipe e atribua tarefas para visualizar os indicadores.</div></div></section>`;return h;}

h+=`<div class="diag-section"><div class="diag-section-header"><h3 class="diag-section-title">Demanda da Secretaria vs. capacidade atual</h3></div><div class="diag-section-help">Demanda total = soma das horas/mês de todas as tarefas com volume e esforço preenchidos (independente de quem é titular). Capacidade total = soma das jornadas mensais cadastradas. <strong>Servidor-equivalente</strong> usa 168h/mês (8h × 21d) como referência de jornada padrão. ${tasksMS>0?`<strong style="color:var(--accent);">${tasksMS} de ${tasksTot} tarefas ainda estão sem volume ou esforço — a demanda real é maior do que a calculada.</strong>`:`Todas as tarefas têm volume e esforço preenchidos.`}<br><span style="font-style:italic;">Nota: este cálculo assume 100% da capacidade nominal. Na prática, produtividade efetiva costuma ser 80-85% por conta de interrupções, atendimento, reuniões, capacitação. Considere essa folga ao interpretar o resultado.</span></div><div class="metrics" style="margin-bottom:0;"><div class="metric"><div class="metric-label">Demanda total</div><div class="metric-value">${Math.round(totalDemandH)}<span class="metric-value-of"> h/mês</span></div><div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;">≈ <strong style="color:var(--ink);font-size:13px;">${fmt1(demandFTE)}</strong> servidores-equivalentes</div></div><div class="metric"><div class="metric-label">Capacidade atual</div><div class="metric-value">${Math.round(totalCapH)}<span class="metric-value-of"> h/mês</span></div><div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;">${state.team.length} integrantes ≈ <strong style="color:var(--ink);font-size:13px;">${fmt1(capFTE)}</strong> servidores-equivalentes</div></div><div class="metric"><div class="metric-label">${diffH>=0?'Folga':'Déficit'}</div><div class="metric-value ${diffClass}">${diffSign}${Math.round(Math.abs(diffH))}<span class="metric-value-of"> h/mês</span></div><div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;">${diffH>=0?`Folga de <strong style="color:var(--moss);font-size:13px;">${fmt1(Math.abs(diffFTE))}</strong> servidor-equivalente`:`Faltam <strong style="color:var(--accent);font-size:13px;">${fmt1(Math.abs(diffFTE))}</strong> servidores-equivalentes`}</div></div></div></div>`;
h+=`<div class="diag-section"><div class="diag-section-header"><h3 class="diag-section-title">Capacidade vs. carga atribuída</h3></div><div class="diag-section-help">Carga = soma de (volume × esforço) das tarefas atribuídas, com peso ${(RESERVE_WEIGHT*100).toFixed(0)}% para tarefas em que a pessoa é reserva. Tarefas sem volume ou sem esforço não entram no cálculo.</div><div>`;
loads.forEach(l=>{const c=l.cap;const tot=l.load.total;const w=Math.min(100,(l.ratio/maxR)*100);const mk=(1/maxR)*100;const pct=c>0?Math.round((tot/c)*100):0;const tH=fmt1(l.load.titularHours),rH=fmt1(l.load.reservaHours);const br=`${l.load.titularTasks}t (${tH}h) + ${l.load.reservaTasks}r (${rH}h)`;const mn=l.load.missingDataCount>0?` · ${l.load.missingDataCount} sem dados`:'';h+=`<div class="capacity-row"><div style="min-width:0;"><div style="font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(l.member.name)}</div><div class="capacity-breakdown"><span class="role-badge-sm ${l.member.role}">${roleShort(l.member.role)}</span> ${l.member.hoursPerDay}h × ${l.member.workdaysPerMonth||DEFAULT_WORKDAYS}d = ${c}h/mês</div></div><div class="capacity-bar-track"><div class="capacity-bar-fill ${l.zone}" style="width:${w}%"></div><div class="capacity-bar-mark" style="left:${mk}%"></div></div><div class="capacity-numbers"><div><span class="pct ${l.zone}">${pct}%</span> · ${fmt1(tot)}h</div><div class="capacity-status ${l.zone}">${zoneLabel(l.zone)}</div><div style="font-size:10px;color:var(--muted);">${br}${mn}</div></div></div>`;});

h+=`<div class="diag-grid"><div class="diag-list-card diag-list"><div class="diag-list-header"><span style="color:var(--accent);display:flex;align-items:center;">${ICONS.alertBig}</span><h4 class="diag-list-title">Tarefas sem titular</h4><span class="diag-list-count">${noT.length}</span></div>${noT.length===0?`<div class="empty">${ICONS.shieldOk} Todas as tarefas têm titular definido.</div>`:`<ul>${noT.map(t=>`<li>${esc(t.name)}</li>`).join('')}</ul>`}</div><div class="diag-list-card diag-list"><div class="diag-list-header"><span style="color:var(--amber);display:flex;align-items:center;">${ICONS.shieldBig}</span><h4 class="diag-list-title">Sem reserva (SPF)</h4><span class="diag-list-count">${spf.length}</span></div>${spf.length===0?`<div class="empty">${ICONS.shieldOk} Todas as tarefas com titular têm reserva.</div>`:`<ul>${spf.map(t=>{const tit=state.team.find(m=>m.id===state.assignments[t.id]?.titularId);return `<li>${esc(t.name)} <span class="item-sub">— ${esc(tit?.name||'')}</span></li>`;}).join('')}</ul>`}</div><div class="diag-list-card diag-list"><div class="diag-list-header"><span style="color:var(--muted);display:flex;align-items:center;">${ICONS.alertBig}</span><h4 class="diag-list-title">Tarefas sem volume ou esforço</h4><span class="diag-list-count">${miss.length}</span></div>${miss.length===0?`<div class="empty">${ICONS.shieldOk} Todas as tarefas com titular têm volume e esforço.</div>`:`<ul>${miss.map(t=>`<li>${esc(t.name)} <span class="item-sub">— não contribui para o cálculo de carga</span></li>`).join('')}</ul>`}</div><div class="diag-list-card diag-list"><div class="diag-list-header"><span style="color:var(--moss);display:flex;align-items:center;">${ICONS.shieldOk}</span><h4 class="diag-list-title">Plenamente cobertas</h4><span class="diag-list-count">${full.length}</span></div>${full.length===0?`<div class="empty" style="color:var(--muted);">Nenhuma tarefa está plenamente coberta ainda.</div>`:`<ul>${full.slice(0,8).map(t=>`<li>${esc(t.name)}</l function formatMonth(yyyymm){const[y,m]=yyyymm.split('-');const n=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];return `${n[parseInt(m)-1]}/${y}`;}
function computeProductivityComparison(){const ps={};state.imports.forEach(imp=>{const sid=imp.servidor;if(!ps[sid])ps[sid]={servidorId:sid,name:imp.servidorName,total:0,months:new Set(),distinctActivities:new Set(),activeCount:0,ignoredCount:0,pendingCount:0,monthlyTotals:{},descriptionCounts:{}};const p=ps[sid];Object.entries(imp.months||{}).forEach(([mo,dc])=>{p.months.add(mo);Object.entries(dc).forEach(([d,c])=>{p.total+=c;p.distinctActivities.add(d);p.monthlyTotals[mo]=(p.monthlyTotals[mo]||0)+c;p.descriptionCounts[d]=(p.descriptionCounts[d]||0)+c;const map=state.activityMapping[d];if(map==='__ignore__')p.ignoredCount+=c;else if(map)p.activeCount+=c;else p.pendingCount+=c;});});});const allMonths=new Set();Object.values(ps).forEach(p=>p.months.forEach(m=>allMonths.add(m)));const allDescs={};Object.values(ps).forEach(p=>{Object.entries(p.descriptionCounts).forEach(([d,c])=>{if(!allDescs[d])allDescs[d]={total:0,byServidor:{}};allDescs[d].total+=c;allDescs[d].byServidor[p.servidorId]=c;});});const topDescs=Object.entries(allDescs).sort((a,b)=>b[1].total-a[1].total).slice(0,10).map(([desc,data])=>({desc,...data}));return{perServant:Object.values(ps),months:Array.from(allMonths).sort(),topDescs};}
function renderComparativo(){if(state.imports.length===0)return '';const data=computeProductivityComparison();if(data.perServant.length===0)return '';const sorted=[...data.perServant].sort((a,b)=>b.total-a.total);const maxTotal=Math.max(1,...sorted.map(p=>p.total));const maxMonthly=Math.max(1,...sorted.flatMap(p=>Object.values(p.monthlyTotals)));let html=`<div style="margin-bottom:28px;"><h3 class="cat-title" style="margin-bottom:12px;">Comparativo de produtividade</h3><div class="info-callout">Comparativo entre os servidores com dados importados, considerando apenas o que foi extraído das planilhas do PJe. Cada linha do PJe é uma <strong>ação atômica</strong> — múltiplas linhas correspondem a uma única tarefa real. Os números servem para dimensionamento relativo entre servidores; não os leia como "tarefas concluídas".</div>`;
html+=`<h4 class="subgroup-title" style="margin-top:8px;">Resumo por servidor</h4><table class="compare-table"><thead><tr><th>Servidor</th><th class="num">Total</th><th class="num">Meses</th><th class="num">Média/mês</th><th class="num">Distintas</th><th>Classificação das atividades</th></tr></thead><tbody>`;
sorted.forEach(p=>{const member=state.team.find(m=>m.id===p.servidorId);const months=p.months.size;const avg=months>0?Math.round(p.total/months):0;const distinct=p.distinctActivities.size;const tot=p.activeCount+p.ignoredCount+p.pendingCount;const aP=tot>0?(p.activeCount/tot*100):0;const iP=tot>0?(p.ignoredCount/tot*100):0;const pP=tot>0?(p.pendingCount/tot*100):0;html+=`<tr><td><div class="servidor-cell">${member?`<span class="role-badge-sm ${member.role}">${roleShort(member.role)}</span>`:'<span style="font-size:9px;color:var(--accent);font-family:var(--mono);">(fora da equipe)</span>'}<span>${esc(p.name)}</span></div></td><td class="num bar-cell" style="--bar-w:${(p.total/maxTotal*100).toFixed(0)}%"><span>${p.total.toLocaleString('pt-BR')}</span></td><td class="num">${months}</td><td class="num">${avg.toLocaleString('pt-BR')}</td><td class="num">${distinct}</td><td><div class="stack-bar" title="Ativas ${aP.toFixed(0)}% · Ignoradas ${iP.toFixed(0)}% · Pendentes ${pP.toFixed(0)}%"><div class="seg-active" style="width:${aP}%"></div><div class="seg-ignored" style="width:${iP}%"></div><div class="seg-pending" style="width:${pP}%"></div></div><div class="stack-legend">${aP.toFixed(0)}% ativas · ${iP.toFixed(0)}% ignor. · ${pP.toFixed(0)}% pend.</div></td></tr>`;});
html+=`</tbody></table>`;
if(data.months.length>1){html+=`<h4 class="subgroup-title" style="margin-top:22px;">Volume mensal</h4><table class="compare-table"><thead><tr><th>Servidor</th>${data.months.map(m=>`<th class="num">${formatMonth(m)}</th>`).join('')}</tr></thead><tbody>`;sorted.forEach(p=>{const member=state.team.find(m=>m.id===p.servidorId);html+=`<tr><td><div class="servidor-cell">${member?`<span class="role-badge-sm ${member.role}">${roleShort(member.role)}</span>`:''}<span>${esc(p.name)}</span></div></td>${data.months.map(m=>{const c=p.monthlyTotals[m]||0;return `<td class="num bar-cell" style="--bar-w:${(c/maxMonthly*100).toFixed(0)}%"><span>${c>0?c.toLocaleString('pt-BR'):'—'}</span></td>`;}).join('')}</tr>`;});html+=`</tbody></table>`;}

data.topDescs.forEach(d=>{const dMax=Math.max(1,...Object.values(d.byServidor));html+=`<tr><td>${esc(d.desc)}</td><td class="num">${d.total.toLocaleString('pt-BR')}</td>${sorted.map(p=>{const c=d.byServidor[p.servidorId]||0;return `<td class="num bar-cell" style="--bar-w:${(c/dMax*100).toFixed(0)}%"><span>${c>0?c.toLocaleString('pt-BR'):'—'}</span></td>`;}).join('')}</tr>`;});

function renderDados(){let h=`<section><div class="section-header"><div class="section-header-text"><h2 class="section-title">Dados reais — produtividade do PJe</h2><div class="section-subtitle">Importe as planilhas mensais de produtividade. O aplicativo lê as atividades, agrupa por mês e calcula o volume mensal real de cada tarefa após mapeamento. Reimportar arquivos do mesmo servidor abrangendo meses já importados substitui os dados desses meses.</div></div><button class="btn-primary" onclick="triggerXlsxImport()">${ICONS.plus} Importar planilha .xlsx</button></div>`;

      if(wantMigrate){
        try{
          await Storage_.createComarca(ls.comarca,ls);
          applyLoadedData(ls);
          ui.screen='app';ui.activeTab='equipe';
          setSaveStatus('saved');
          render();
          showToast('Migrado: '+Storage_.currentFileName);
          return;
        }catch(e){showToast('Falha ao migrar: '+e.message,'error');}
      }
    }
    render();
  }catch(e){
    if(e.name==='AbortError')return;
    showToast('Erro: '+(e.message||'falha'),'error');
  }
}
async function reauthorizeFolder(){
  const ok=await Storage_.requestStoredPermission();
  if(ok){showToast('Pasta autorizada.');render();}
  else showToast('Permissão negada.','warning');
}
async function changeFolderFlow(){
  if(!confirm('Trocar de pasta? Os arquivos atuais permanecem onde estão. Você precisará escolher uma nova pasta.'))return;
  await Storage_.unlinkFolder();
  state={comarca:null,team:[],tasks:structuredClone(SEED_TASKS),assignments:{},imports:[],activityMapping:{}};
  ui.screen='selector';
  render();
}
async function openComarcaFile(fileName){
  try{
    const d=await Storage_.openComarca(fileName);
    applyLoadedData(d);
    ui.screen='app';ui.activeTab='equipe';ui.creatingNew=false;
    setSaveStatus('saved');
    render();
  }catch(e){showToast('Erro ao abrir: '+e.message,'error');}
}
async function deleteComarcaFile(fileName,comarcaName){
  if(!confirm(`Apagar permanentemente o arquivo "${fileName}" (${comarcaName})? Esta ação não pode ser desfeita.`))return;
  try{
    await Storage_.deleteComarca(fileName);
    showToast('Arquivo apagado.');
    render();
  }catch(e){showToast('Erro ao apagar: '+e.message,'error');}
}
function newComarcaFlow(){
  ui.creatingNew=true;
  ui.modalData={uf:'MG',comarca:'',orgao:''};
  render();
}
function continueLegacy(){
  const d=Storage_.loadFromLocalStorage();
  applyLoadedData(d);
  if(state.comarca&&state.comarca.comarca){
    ui.screen='app';ui.creatingNew=false;
  }else{
    ui.creatingNew=true;ui.modalData={uf:'MG',comarca:'',orgao:''};
  }
  render();
}
async function renderSelector(){
  const brand=`<div class="startup-brand"><div class="startup-eyebrow">Tribunal de Justiça de Minas Gerais</div><h1 class="startup-title">Secretaria</h1><div class="startup-subtitle">Ferramenta de planejamento organizacional</div></div>`;
  let card='';
  if(Storage_.mode==='unsupported'){
    card=`<div class="startup-card"><h2 class="startup-card-title">Navegador sem suporte</h2><div class="startup-card-help">Este navegador não permite salvar dados em pasta automaticamente. Para isso, use <strong>Chrome, Edge, Brave ou Opera</strong>. Por ora, o aplicativo trabalha com uma única comarca por vez, salva no próprio navegador. Você pode usar Exportar e Importar para mover dados entre máquinas.</div><button class="btn-confirm" onclick="continueLegacy()">Continuar mesmo assim</button></div>`;
  }else if(Storage_.mode==='folder-pending-permission'){
    card=`<div class="startup-card"><h2 class="startup-card-title">Reautorizar acesso à pasta</h2><div class="startup-card-help">A pasta vinculada anteriormente precisa que você confirme o acesso novamente (o navegador pede a cada nova sessão, por segurança).</div><button class="btn-confirm" onclick="reauthorizeFolder()">Autorizar acesso</button><div style="margin-top:14px;display:flex;justify-content:flex-end;"><button class="btn-secondary" onclick="changeFolderFlow()">Trocar de pasta</button></div></div>`;
  }else if(Storage_.mode==='folder-not-linked'){
    let migrationNote='';
    const ls=Storage_.loadFromLocalStorage();
    if(ls&&ls.comarca&&ls.comarca.comarca){
      migrationNote=`<div class="info-callout" style="margin-top:14px;"><strong>Há dados em memória do navegador:</strong> "${esc(ls.comarca.comarca)}" com ${(ls.team||[]).length} integrante(s). Após escolher a pasta, o aplicativo perguntará se você quer salvá-los como arquivo.</div>`;
    }
    card=`<div class="startup-card"><h2 class="startup-card-title">Vincular pasta de dados</h2><div class="startup-card-help">Escolha uma pasta no seu computador onde os dados de cada comarca serão salvos como arquivos JSON, um por comarca. Você só faz isso uma vez por máquina/navegador. Sugestão: criar uma pasta dedicada, por exemplo <strong>Documentos/Secretaria</strong>.</div><button class="btn-confirm" onclick="linkFolderFlow()">Escolher pasta…</button>${migrationNote}<div style="margin-top:14px;display:flex;justify-content:flex-end;"><button class="btn-secondary" onclick="continueLegacy()">Pular e usar só o navegador</button></div></div>`;
  }else if(Storage_.mode==='folder'){
    let files=[];
    try{files=await Storage_.listComarcaFiles();}catch(e){console.error(e);}
    const folderName=Storage_.dirHandle?.name||'pasta';
    let listHtml='';
    if(files.length===0){
      listHtml=`<div style="padding:20px 0;text-align:center;color:var(--muted);font-style:italic;font-size:13px;">Nenhuma comarca cadastrada nesta pasta ainda.</div>`;
    }else{
      listHtml='<div class="comarca-list">'+files.map(f=>{
        const tc=(f.team||[]).length,ic=(f.imports||[]).length;
        const dt=new Date(f.lastModified).toLocaleDateString('pt-BR');
        const fn=esc(f.fileName).replace(/'/g,"\\'");
        const cn=esc(f.comarca.comarca||f.fileName).replace(/'/g,"\\'");
        return `<div style="position:relative;"><button class="comarca-item" onclick="openComarcaFile('${fn}')"><div class="comarca-item-name">${esc(f.comarca.comarca||f.fileName)}</div><div class="comarca-item-meta">${esc(f.comarca.orgao||'(sem órgão julgador)')} · ${tc} integrante${tc===1?'':'s'} · ${ic} importação${ic===1?'':'ões'} · atualizado ${dt}</div></button><button class="icon-btn danger" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);" title="Apagar arquivo" onclick="event.stopPropagation();deleteComarcaFile('${fn}','${cn}')">${ICONS.trash}</button></div>`;
      }).join('')+'</div>';
    }
    let migrationCallout='';
    const ls=Storage_.loadFromLocalStorage();
    if(ls&&ls.comarca&&ls.comarca.comarca){
      const expectedName=comarcaToFileName(ls.comarca.comarca);
      if(!files.some(f=>f.fileName===expectedName)){
        migrationCallout=`<div class="info-callout" style="margin-top:14px;"><strong>Migração pendente:</strong> há um cadastro de "${esc(ls.comarca.comarca)}" no navegador que ainda não está nesta pasta. <a href="#" onclick="event.preventDefault();migrateLocalStorageToFolder()">Salvar como arquivo agora →</a></div>`;
      }
    }
    card=`<div class="startup-card" style="max-width:600px;"><div class="folder-info"><span>Pasta: <span class="folder-info-path">${esc(folderName)}</span> · ${files.length} comarca${files.length===1?'':'s'}</span><button class="btn-secondary" style="padding:4px 10px;font-size:11px;" onclick="changeFolderFlow()">Trocar pasta</button></div><h2 class="startup-card-title">Comarcas cadastradas</h2><div class="startup-card-help">Clique em uma comarca para abrir os dados dela. O aplicativo lê e grava no arquivo JSON correspondente automaticamente.</div>${listHtml}<button class="btn-confirm" style="width:100%;margin-top:14px;" onclick="newComarcaFlow()">+ Adicionar nova comarca</button>${migrationCallout}</div>`;
  }else{
    card=`<div class="startup-card"><div class="startup-card-help">Inicializando…</div></div>`;
  }
  return `<div class="startup-screen">${brand}${card}</div>`;
}
async function migrateLocalStorageToFolder(){
  const ls=Storage_.loadFromLocalStorage();
  if(!ls||!ls.comarca){showToast('Sem dados para migrar.','warning');return;}
  try{
    await Storage_.createComarca(ls.comarca,ls);
    applyLoadedData(ls);
    ui.screen='app';ui.activeTab='equipe';ui.creatingNew=false;
    setSaveStatus('saved');
    render();
    showToast('Migrado: '+Storage_.currentFileName);
  }catch(e){showToast('Falha: '+e.message,'error');}
}
function renderStartup(){
  const c=ui.modalData||{uf:'MG',comarca:'',orgao:''};
  const isFolder=Storage_.mode==='folder';
  const cancelLabel=isFolder?'← Voltar à lista':'Cancelar';
  const confirmLabel=isFolder?'Criar comarca':'Iniciar →';
  return `<div class="startup-screen"><div class="startup-brand"><div class="startup-eyebrow">Tribunal de Justiça de Minas Gerais</div><h1 class="startup-title">Secretaria</h1><div class="startup-subtitle">Ferramenta de planejamento organizacional</div></div><div class="startup-card"><h2 class="startup-card-title">Nova Comarca</h2><div class="startup-card-help">Informe a comarca e o órgão julgador. ${isFolder?`O aplicativo criará um novo arquivo JSON na pasta vinculada.`:`As informações aparecerão no cabeçalho.`}</div><div class="form-field"><label class="form-label">Comarca</label><input id="startup-comarca" class="input" type="text" list="comarcas-mg-list" value="${esc(c.comarca||'')}" placeholder="Digite ou escolha…" autocomplete="off"><datalist id="comarcas-mg-list">${COMARCAS_MG.map(co=>`<option value="${esc(co)}"></option>`).join('')}</datalist><div class="form-hint">Lista oficial das comarcas do TJMG. Se não estiver na lista, basta digitar o nome.</div></div><div class="form-field"><label class="form-label">Órgão Julgador</label><input id="startup-orgao" class="input" type="text" value="${esc(c.orgao||'')}" placeholder="Ex: Vara Única" autocomplete="off"></div><div style="display:flex;justify-content:space-between;margin-top:18px;"><button class="btn-secondary" onclick="cancelStartup()">${cancelLabel}</button><button class="btn-confirm" onclick="completeStartup()">${confirmLabel}</button></div></div></div>`;
}
function comarcaLabel(){const c=state.comarca;if(!c||!c.comarca)return '';const parts=[];if(c.orgao)parts.push(c.orgao);parts.push('Comarca de '+c.comarca+'/'+(c.uf||'MG'));return parts.join(' — ');}
function closeModalIfBackdrop(e){if(e.target.classList.contains('modal-backdrop'))closeModal();}
async function render(){
  const header=document.querySelector('header.app-header');
  const main=document.getElementById('content');
  const tabsEl=document.getElementById('tabs');
  const modalRoot=document.getElementById('modal-root');
  const noComarca=!state.comarca||!state.comarca.comarca;
  // Show selector if explicitly requested or no comarca loaded
  if(noComarca||ui.screen==='selector'){
    if(header)header.style.display='none';
    if(tabsEl)tabsEl.innerHTML='';
    if(modalRoot)modalRoot.innerHTML='';
    if(ui.creatingNew){main.innerHTML=renderStartup();}
    else{main.innerHTML='<div class="startup-screen"><div class="startup-card"><div class="startup-card-help">Carregando…</div></div></div>';try{main.innerHTML=await renderSelector();}catch(e){console.error(e);main.innerHTML=`<div class="startup-screen"><div class="startup-card"><div class="startup-card-help" style="color:var(--accent);">Erro ao carregar: ${esc(e.message||'')}</div><button class="btn-secondary" onclick="changeFolderFlow()">Trocar pasta</button></div></div>`;}}
    return;
  }
  // App view
  if(header)header.style.display='';
  const eb=document.getElementById('header-eyebrow');
  if(eb){let lbl=comarcaLabel();if(Storage_.mode==='folder'&&Storage_.currentFileName)lbl+=' · '+Storage_.currentFileName;eb.textContent=lbl;}
  if(tabsEl)tabsEl.innerHTML=renderTabs();
  const r={equipe:renderEquipe,tarefas:renderTarefas,atribuicoes:renderAtribuicoes,diagnostico:renderDiagnostico,dados:renderDados};
  main.innerHTML=r[ui.activeTab]();
  let mh='';
  if(ui.modal==='member')mh=renderMemberModal();
  else if(ui.modal==='task')mh=renderTaskModal();
  else if(ui.modal==='confirm')mh=renderConfirmModal();
  else if(ui.modal==='associate')mh=renderAssociateModal();
  else if(ui.modal==='comarca')mh=renderComarcaModal();
  modalRoot.innerHTML=mh;
}
document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&ui.modal)closeModal();});
(async()=>{
  await Storage_.init();
  // Initial state: in folder modes, show selector. In unsupported/legacy, load localStorage.
  if(Storage_.mode==='unsupported'){
    ui.screen='selector';
  }else if(Storage_.mode==='folder'||Storage_.mode==='folder-pending-permission'||Storage_.mode==='folder-not-linked'){
    ui.screen='selector';
  }
  render();
})();
</script>
</body>
